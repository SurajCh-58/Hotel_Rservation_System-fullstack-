# ─────────────────────────────────────────────────────────────
#  HotelReservation – Backend Compose
#
#  This is your EXISTING file with ONE addition:
#    networks.hotelreservation_network.name is set explicitly
#    so the frontend compose can join it via "external: true".
#
#  Run from Django Day-44/backend/:
#    docker compose up --build -d
# ─────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: hotelreservation-web:latest
    container_name: hotelreservation-web
    command: gunicorn HotelReservation.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=HotelReservation.settings
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

  db:
    image: postgres:17
    container_name: hotelreservation-db
    environment:
      POSTGRES_DB:              ${POSTGRES_DB}
      POSTGRES_USER:            ${POSTGRES_USER}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS:     "-A scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backups:/backups  # Uncomment to enable host backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suraj} -d ${POSTGRES_DB:-hotel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  hotelreservation_network:
    driver: bridge
    # ↓ Only change from your original: explicit name so the
    #   frontend compose can reference it as external: true
    name: hotelreservation_network