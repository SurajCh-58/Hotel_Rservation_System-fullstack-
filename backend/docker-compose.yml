# ─────────────────────────────────────────────────────────────
#  HotelReservation – Backend Compose
#
#  Run from backend/:
#    docker compose up --build -d
#
#  FIX #7: Removed "5432:5432" port mapping from the db service.
#  PostgreSQL is now reachable only by containers on the same
#  Docker network (hotelreservation_network), not from the host.
#  For local development access use:
#    docker compose exec db psql -U $POSTGRES_USER $POSTGRES_DB
# ─────────────────────────────────────────────────────────────

services:
  web:
    build:
      context: .
      dockerfile: dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: hotelreservation-web:latest
    container_name: hotelreservation-web
    # FIX #4: explicitly correct WSGI path (also fixes dockerfile CMD)
    command: gunicorn HotelReservation.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=HotelReservation.settings
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

  db:
    image: postgres:17
    container_name: hotelreservation-db
    environment:
      POSTGRES_DB:              ${POSTGRES_DB}
      POSTGRES_USER:            ${POSTGRES_USER}
      POSTGRES_PASSWORD:        ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS:     "-A scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # - ./backups:/backups  # Uncomment to enable host backups
    # FIX #7: DB port is NOT published to the host.
    # Containers on hotelreservation_network can still reach it at
    # postgres://hotelreservation-db:5432/...
    # ports:
    #   - "5432:5432"   ← removed; exposes DB to any host process
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suraj} -d ${POSTGRES_DB:-hotel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
    name: hotelreservation_media_volume 

networks:
  hotelreservation_network:
    driver: bridge
    name: hotelreservation_network