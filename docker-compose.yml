# ─────────────────────────────────────────────────────────────
#  HotelReservation – Combined Compose
#
#  Replaces both backend/docker-compose.yml and
#  frontend/docker-compose.yml (which needed nginx).
#
#  Frontend is now plain nginx serving ONLY static files.
#  All /api/, /_allauth/, /accounts/, /admin/ requests go
#  DIRECTLY to http://localhost:8000 from the browser —
#  no nginx reverse-proxy for the backend.
#
#  Start everything:
#    docker compose up --build -d
#
#  Access:
#    Frontend:  http://localhost
#    Backend:   http://localhost:8000
# ─────────────────────────────────────────────────────────────

services:
  # ── Django Backend ────────────────────────────────────────
  web:
    build:
      context: ./backend
      dockerfile: dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: hotelreservation-web:latest
    container_name: hotelreservation-web
    command: gunicorn HotelReservation.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=HotelReservation.settings
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

  # ── PostgreSQL ────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: hotelreservation-db
    environment:
      POSTGRES_DB:          ${POSTGRES_DB:-hotel_db}
      POSTGRES_USER:        ${POSTGRES_USER:-suraj}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD:-suraj2058}
      POSTGRES_INITDB_ARGS: "-A scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-suraj} -d ${POSTGRES_DB:-hotel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotelreservation_network

  # ── Static Frontend (nginx, static files only) ────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    image: hotelreservation-frontend:latest
    container_name: hotelreservation-frontend
    ports:
      - "80:80"
    volumes:
      - media_volume:/usr/share/nginx/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - hotelreservation_network

volumes:
  postgres_data:
  static_volume:
  media_volume:
    name: hotelreservation_media_volume

networks:
  hotelreservation_network:
    driver: bridge
    name: hotelreservation_network