# ─────────────────────────────────────────────────────────────
#  HotelReservation – Frontend Nginx
#
#  This nginx serves ONLY the static frontend files.
#  The browser talks directly to http://localhost:8000
#  for all backend requests (api, _allauth, accounts, admin).
#
#  Why no reverse-proxy?
#  ─────────────────────
#  The Google OAuth flow requires the browser session cookie
#  set by Django to be sent back from google-callback.html.
#  With SameSite=None + Secure=False (HTTP/localhost),
#  Chrome silently drops the cookie when it crosses an
#  nginx proxy boundary.  Direct browser→Django on port 8000
#  keeps everything same-origin for the cookie exchange,
#  so /_allauth/browser/v1/auth/session receives the cookie
#  and returns the session_token correctly.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    # ── Gzip compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Serve static frontend files ───────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # HTML: never cache
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # CSS / JS / images: cache aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files: served from shared Docker volume ──────────
    location ^~ /media/ {
        alias  /usr/share/nginx/media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Health check endpoint ─────────────────────────────────
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── Error pages ───────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}