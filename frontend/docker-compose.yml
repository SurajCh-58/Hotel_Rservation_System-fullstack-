# ─────────────────────────────────────────────────────────────
#  HotelReservation – Frontend Compose
#
#  Runs Nginx (static files + reverse proxy to Django).
#  Joins the network created by backend/docker-compose.yml.
#
#  ⚠️  Start backend FIRST (it creates the shared network):
#    docker compose -f backend/docker-compose.yml up --build -d
#
#  Then start frontend:
#    docker compose -f frontend/docker-compose.yml up --build
#
#  Access: http://localhost
# ─────────────────────────────────────────────────────────────

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hotelreservation-frontend:latest
    container_name: hotelreservation-frontend
    ports:
      - "80:80"
    volumes:
      - media_volume:/usr/share/nginx/media:ro   # ← shared with backend; read-only
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - hotelreservation_network

volumes:
  media_volume:
    external: true
    name: hotelreservation_media_volume   # ← must match backend's explicit name

networks:
  hotelreservation_network:
    external: true   # Must already exist — created by backend compose