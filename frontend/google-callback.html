<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completing Sign-In…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #374151;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
    p  { font-size: 0.875rem; color: #6b7280; }
    .icon  { font-size: 2.5rem; margin-bottom: 1rem; }
    .error { color: #dc2626; }
    .note  { margin-top: 1rem; font-size: 0.8rem; color: #9ca3af; }
  </style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Completing sign-in…</h1>
  <p id="subtitle">Please wait while we finish connecting your Google account.</p>
</div>

<script>
/**
 * google-callback.html
 * ─────────────────────────────────────────────────────────────
 * Landing page after allauth's Google OAuth browser flow.
 *
 * FLOW:
 *  1. Parent opens /accounts/google/login/?process=login in a popup.
 *  2. allauth handles the OAuth server-side, logs in the user with a
 *     Django browser session, redirects popup here.
 *  3. We call GET /_allauth/browser/v1/auth/session (cookie sent
 *     automatically) → returns meta.session_token.
 *  4. We call GET /_allauth/app/v1/auth/session with
 *     X-Session-Token header → returns JWT access + refresh tokens.
 *  5. postMessage tokens to parent → parent stores them → showApp().
 *
 * WHY TWO STEPS?
 *   Chrome blocks SameSite=None cookies on HTTP (no Secure flag).
 *   The browser client's /auth/session returns a session_token in JSON
 *   (not a cookie) that we can pass as a header to the app client.
 *   This avoids relying on the session cookie surviving cross-context.
 *
 * NOTE on SOCIALACCOUNT_LOGIN_ON_GET = False:
 *   allauth may redirect to /accounts/google/login/ first and render
 *   a confirmation form (Cancel / Continue). If this page is loaded
 *   with a ?next= param and contains that form, we auto-submit it so
 *   the popup flows straight through to Google without user action.
 *   The actual Google account-picker (screenshot) is shown by Google,
 *   not allauth — it is controlled by AUTH_PARAMS prompt=select_account.
 */
(function () {
  'use strict';

  // ── Auto-submit allauth's socialaccount confirmation form ─────────────
  // When SOCIALACCOUNT_LOGIN_ON_GET=False, allauth renders a page with a
  // form containing a "Continue" button before the Google redirect.
  // We detect that page and submit it automatically so users see the
  // real Google account picker (Cancel/Continue) rather than a Django page.
  const confirmForm = document.querySelector('form[action*="google/login"]');
  if (confirmForm) {
    confirmForm.submit();
    return; // stop — page will redirect to Google
  }

  const CLOSE_DELAY_MS = 800;
  const FETCH_TIMEOUT  = 10000;

  function showError(message) {
    const safeMsg = String(message).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    document.getElementById('card').innerHTML = `
      <div class="icon">❌</div>
      <h1 class="error">Sign-in failed</h1>
      <p>${safeMsg}</p>
      <p class="note">You can close this window.</p>
    `;
  }

  function notifyParent(payload) {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage(payload, window.location.origin);
    }
  }

  function deliverTokens(access, refresh) {
    document.getElementById('spinner').style.borderTopColor = '#16a34a';
    document.getElementById('title').textContent    = 'Signed in!';
    document.getElementById('subtitle').textContent = 'Returning you to the app…';
    notifyParent({ type: 'GOOGLE_AUTH', access_token: access, refresh_token: refresh || null });
    setTimeout(() => window.close(), CLOSE_DELAY_MS);
  }

  function deliverError(message) {
    showError(message);
    notifyParent({ type: 'GOOGLE_AUTH', error: message });
    setTimeout(() => window.close(), 3000);
  }

  function fetchWithTimeout(url, options) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), FETCH_TIMEOUT);
    return fetch(url, { ...options, signal: controller.signal })
      .finally(() => clearTimeout(id));
  }

  // Check for OAuth error passed in URL
  const query    = new URLSearchParams(window.location.search);
  const fragment = new URLSearchParams(window.location.hash.substring(1));
  const urlError = query.get('error') || fragment.get('error');
  if (urlError) {
    deliverError(decodeURIComponent(String(urlError).replace(/\+/g, ' ')));
    return;
  }

  (async function main() {
    try {

      // ── STEP 1: browser client → get session_token ─────────────────────
      // The browser session cookie allauth set during OAuth callback is sent
      // automatically here (same-site request). The browser client returns
      // meta.session_token in JSON — no cookie dependency needed after this.
      const browserRes = await fetchWithTimeout(
        '/_allauth/browser/v1/auth/session',
        { credentials: 'include' }
      );

      const browserData = await browserRes.json().catch(() => ({}));
      console.log('[callback] browser session:', browserRes.status, browserData);

      const sessionToken = browserData?.meta?.session_token;

      if (!browserRes.ok || !sessionToken) {
        const detail = browserData?.errors?.[0]?.message
          || `Sign-in failed (${browserRes.status}). Please try again.`;
        return deliverError(detail);
      }

      // ── STEP 2: app client → exchange session_token for JWTs ───────────
      // Pass the session_token as X-Session-Token header. The app client
      // reads it, finds the authenticated Django session, and returns
      // JWT access + refresh tokens. No cookie required for this step.
      const appRes = await fetchWithTimeout(
        '/_allauth/app/v1/auth/session',
        {
          credentials: 'include',
          headers: { 'X-Session-Token': sessionToken }
        }
      );

      const appData = await appRes.json().catch(() => ({}));
      console.log('[callback] app session:', appRes.status, appData);

      const access  = appData?.meta?.access_token;
      const refresh = appData?.meta?.refresh_token;

      if (access) {
        return deliverTokens(access, refresh);
      }

      deliverError('No access token returned. Please try again.');

    } catch (err) {
      if (err.name === 'AbortError') {
        deliverError('Sign-in timed out. Please try again.');
      } else {
        console.error('[callback] error:', err);
        deliverError('Network error during sign-in. Please try again.');
      }
    }
  })();

})();
</script>
</body>
</html>
